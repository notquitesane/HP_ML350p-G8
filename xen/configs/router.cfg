name = "gentoo-router"
memory = 2048
vcpus = 2

builder = "hvm"
type = "hvm"

# Disk (your LV)
disk = [
	'phy:/dev/vg/xen-router,xvda,w'
]

# Network (2 interfaces)
vif = [
	'bridge=br0',      # WAN (Xfinity side)
	'bridge=br-lan'    # internal LAN (we will create)
]

boot = "d"
sdl = 0
vnc = 1
vnclisten = "127.0.0.1"


# Install ISO (temporary)
cdrom = "/var/lib/xen/images/gentoo/install-amd64-minimal.iso"

# Console
serial = "pty"
stdvga = 0
